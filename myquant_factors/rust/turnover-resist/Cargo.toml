[package]
name = "turnover-resist"
version = "0.1.0"
edition = "2021"

[lib]
name = "turnover_resist"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "turnover-resist"
path = "src/main.rs"

[[bin]]
name = "debug-precision"
path = "src/debug_precision.rs"

[dependencies]
polars = { version = "0.46", features = ["lazy", "parquet", "strings", "dtype-date", "dtype-datetime", "dtype-time"], default-features = false }
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
csv = "1.3"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
duckdb = { version = "1.2", features = ["bundled"], optional = true }  # load_all_stocks_duckdb() in data.rs
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }  # 结果写入实时链路
pyo3 = { version = "0.24", features = ["extension-module"] }

[features]
default = []
duckdb = ["dep:duckdb"]
redis-stream = ["dep:redis"]

[profile.dev]
# Line tables only (not full DWARF) — much smaller debuginfo for polars' 250+ crates
debug = 1

[profile.test]
# Inherits from dev; reduce debuginfo for faster test compilation
debug = 1

[profile.release]
# Thin LTO: ~90% of fat LTO performance, ~5x faster linking
lto = "thin"
# Keep max optimization for runtime performance
opt-level = 3
# 16 CGUs for parallel LLVM codegen — much faster than 1
codegen-units = 16
# No debug symbols — significant compile/link speedup (DWARF is expensive)
debug = 0
# Strip symbols from binary for smaller size and faster I/O
strip = true

[profile.release-fast]
# Fast iteration profile: no LTO, same opt-level
# Daily dev loop — ~5x faster rebuild than full release
inherits = "release"
lto = false
