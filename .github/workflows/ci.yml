name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  factor-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Source retains the old optional sccache config; this runner needs no wrapper.
      RUSTC_WRAPPER: ""
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Check relocated Rust numerical source (no data or computation run)
        working-directory: myquant_factors/rust/turnover-resist
        run: cargo check --locked --all-targets

  joint-return:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Track B needs NumPy for P-REF bootstrap, but no qlib or external data.
      - name: Install test dependencies
        run: python -m pip install pytest numpy
      - name: Run joint-return regression tests
        env:
          PYTHONPATH: tests:.
        run: |
          python -m pytest -q \
            tests/test_joint_return_hash_accel.py \
            tests/test_joint_return_rule_intents.py \
            tests/test_joint_return_freeze_snapshot.py \
            tests/test_joint_return_portfolio.py \
            tests/test_joint_return_intent_clocks.py \
            tests/test_joint_return_control_only.py \
            tests/test_joint_return_ab_kit.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MyQuant
    steps:
      - uses: actions/checkout@v4
        with:
          path: MyQuant

      - name: Validate shared source read access
        working-directory: ${{ github.workspace }}
        env:
          INFRA_READ_KEY: ${{ secrets.MYQUANT_INFRA_READ_KEY }}
          OPS_READ_KEY: ${{ secrets.MYQUANT_OPS_READ_KEY }}
        run: |
          if [ -z "$INFRA_READ_KEY" ] || [ -z "$OPS_READ_KEY" ]; then
            echo "::error::Configure MYQUANT_INFRA_READ_KEY and MYQUANT_OPS_READ_KEY with separate read-only deploy keys."
            exit 1
          fi

      - name: Check out infra source beside MyQuant
        uses: actions/checkout@v4
        with:
          repository: baiyibing/MyQuant-infra
          path: MyQuant-infra
          ssh-key: ${{ secrets.MYQUANT_INFRA_READ_KEY }}
          persist-credentials: false

      - name: Check out shared workflow source beside MyQuant
        uses: actions/checkout@v4
        with:
          repository: baiyibing/grok-bot-ops
          path: grok-bot-ops
          ssh-key: ${{ secrets.MYQUANT_OPS_READ_KEY }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # qlib 按开发基准 commit 源码安装（requirements.txt 注明的口径，勿用发布包）
      # eng-perf P1-8: cache qlib-dev tree; key binds OS + py3.12 + literal 79633dd9 + reqs hash
      - name: Cache qlib-dev (pinned 79633dd9)
        id: cache-qlib
        uses: actions/cache@v4
        with:
          path: MyQuant/qlib-dev
          key: ${{ runner.os }}-py3.12-qlib-79633dd9-${{ hashFiles('MyQuant/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py3.12-qlib-79633dd9-

      - name: Install qlib (pinned source commit 79633dd9)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d qlib-dev/.git ]]; then
            git clone https://github.com/microsoft/qlib.git qlib-dev
            git -C qlib-dev checkout 79633dd9
          else
            head="$(git -C qlib-dev rev-parse HEAD)"
            if [[ "$head" != 79633dd9* ]]; then
              echo "::error::qlib-dev cache pin mismatch: expected 79633dd9*, got $head"
              exit 1
            fi
            echo "qlib-dev cache HIT; verified pin $head"
          fi
          pip install -e qlib-dev

      - name: Install project deps
        run: |
          pip install -r requirements.txt pytest

      - name: Verify four-repo pandas pin
        run: python -c "import pandas; print('pandas', pandas.__version__); assert pandas.__version__ == '3.0.6', pandas.__version__"

      - name: Run tests
        shell: bash
        run: |
          python -m pytest my_tests tests my_scripts/test_zhangting_filter.py -q
